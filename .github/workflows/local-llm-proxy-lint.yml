name: Local LLM Proxy Lint

on:
  push:
    paths:
      - 'src/**'
      - 'test/**'
      - '.github/workflows/local-llm-proxy-lint.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - '.github/workflows/local-llm-proxy-lint.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: |
          shellcheck src/lib.sh
          shellcheck src/load-model.sh
          shellcheck test/test-setup.sh

      - name: Check bash syntax
        run: |
          bash -n src/lib.sh
          bash -n src/load-model.sh
          bash -n test/test-setup.sh

      - name: Validate docker-compose.yml
        run: |
          docker compose \
            --env-file src/config/.env.example \
            -f src/config/docker-compose.yml \
            config -q

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: |
          yamllint -c src/config/.yamllint \
            src/config/litellm-config.yaml \
            src/config/docker-compose.yml \
            .github/workflows/local-llm-proxy-lint.yml