name: Python CLI Quality

on:
  pull_request:
    paths:
      - 'src/local_llm_proxy/**'
      - 'tests/**'
      - 'config/**'
      - 'pyproject.toml'
      - '.pre-commit-config.yaml'
      - '.github/workflows/python-cli-quality.yml'
      - '.coderabbit.yaml'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run code quality checks
        run: pre-commit run --all-files

      - name: Run pytest
        run: pytest -q

      - name: Validate docker compose
        run: |
          docker compose \
            --env-file config/.env.example \
            -f config/docker-compose.yml \
            config -q
