name: Python CLI Quality

on:
  pull_request:
    paths:
      - 'local_llm_proxy/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.pre-commit-config.yaml'
      - '.github/workflows/python-cli-quality.yml'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check .

      - name: Run pytest
        run: pytest -q
