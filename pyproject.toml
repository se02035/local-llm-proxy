[project]
name = "local-llm-proxy"
version = "0.1.0"
description = "CLI for managing local LiteLLM proxy and Ollama models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "click",
  "python-dotenv",
  "requests",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
  "pre-commit",
]

[project.scripts]
local-llm-proxy = "local_llm_proxy.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.setuptools.packages.find]
include = ["local_llm_proxy*"]
