services:
  litellm:
    image: ghcr.io/berriai/litellm:v1.83.7-stable
    container_name: litellm-proxy
    volumes:
      - ${LITELLM_CONFIG_FILE:-./litellm-config.yaml}:/app/config.yaml
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    environment:
      - UI_USERNAME=${UI_USERNAME:-admin}
      - UI_PASSWORD=${UI_PASSWORD:-[REDACTED]}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-[REDACTED]}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-[REDACTED]}:${POSTGRES_PASSWORD:-[REDACTED]}@db:5432/${POSTGRES_DB:-litellm}
      - STORE_MODEL_IN_DB=True
      - OLLAMA_HOST=${OLLAMA_HOST:-[REDACTED]}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-[REDACTED]}
      - LITELLM_OLLAMA_MODEL=ollama/${OLLAMA_MODEL:-[REDACTED]}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, sys; sys.exit(0) if urllib.request.urlopen('http://localhost:4000/health/readiness').getcode() == 200 else sys.exit(1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16.13
    container_name: litellm-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-[REDACTED]}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-[REDACTED]}
      - POSTGRES_DB=${POSTGRES_DB:-litellm}
    volumes:
      - litellm_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-[REDACTED]} -d ${POSTGRES_DB:-litellm}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ngrok:
    image: ngrok/ngrok:3.37.6-alpine
    container_name: ngrok-tunnel
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: ["http", "litellm:4000"]
    ports:
      - "127.0.0.1:4040:4040"
    depends_on:
      litellm:
        condition: service_healthy

volumes:
  litellm_data:
